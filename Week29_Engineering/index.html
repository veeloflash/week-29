<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 29 Knowledge Workflow</title>
<style>
*{box-sizing:border-box}body{font:16px/1.55 system-ui;color:#172d44;background:#f3f6fa;margin:0}main{max-width:1050px;margin:30px auto;padding:0 18px}section,article{background:white;border:1px solid #ccd9e6;border-radius:8px;padding:18px;margin:16px 0}label{display:block;font-weight:600}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #9fb0c4;border-radius:4px}input,textarea{width:100%}textarea{min-height:120px}button{background:#2456a5;color:white;cursor:pointer;margin:8px 8px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}h2{font-size:20px}small{color:#4c6179}.row{display:flex;gap:10px;flex-wrap:wrap}#message{min-height:28px;color:#873a16}details{margin:12px 0}summary{cursor:pointer}
</style></head><body><main>
<h1>Knowledge Workflow Assistant</h1><p>Follow a policy question through its evidence, review the answer, and resume it after approval.</p>
<section><label for="token">Local access token</label><input id="token" type="password" autocomplete="off" placeholder="Paste a token from the server terminal"><small>Use the user token to start a question, reviewer-1 to review, and admin to update knowledge.</small></section>
<section><form id="question-form"><label for="question">Question</label><input id="question" value="Can Employee A approve Expense X under the current policy?" required><button>Start workflow</button></form></section>
<p id="message" role="status"></p><button id="refresh">Refresh workflows</button><div id="flows"></div>
<section><h2>Knowledge versions</h2><button id="inventory">Refresh source inventory</button><pre id="sources"></pre>
<details><summary>Update a knowledge source</summary><label for="document">New document JSON</label><textarea id="document"></textarea><button id="update">Validate and ingest</button></details>
<details><summary>Roll back a source</summary><label for="docid">Document ID</label><input id="docid" value="approval-policy"><label for="version">Restore version</label><input id="version" type="number" value="2" min="1"><label for="rollback-reason">Reason</label><input id="rollback-reason"><button id="rollback">Roll back</button></details></section>
</main><script>
const el=id=>document.getElementById(id);
function add(parent,tag,text){const item=document.createElement(tag);if(text!==undefined)item.textContent=text;parent.append(item);return item}
async function api(path,body){const response=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+el('token').value},body:JSON.stringify(body)}:{});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function action(fn){try{el('message').textContent='Working…';await fn();el('message').textContent='Saved.';await refresh()}catch(error){el('message').textContent=error.message}}
async function refresh(){const flows=await api('flows');el('flows').replaceChildren();for(const flow of flows){const card=add(el('flows'),'article');add(card,'h2',flow.question);add(card,'p',flow.state+' · '+flow.id+' · revision '+flow.revision);if(flow.error)add(card,'p',flow.error);add(card,'p',flow.draft||'The workflow is gathering evidence.');const plan=add(card,'details');add(plan,'summary','Retrieval plan');add(plan,'pre',JSON.stringify(flow.plan,null,2));const chain=add(card,'details');add(chain,'summary','Evidence chain and versions');add(chain,'pre',JSON.stringify(flow.hops,null,2));const trace=add(card,'details');add(trace,'summary','Transition and audit trace');add(trace,'pre',JSON.stringify(flow.audit,null,2));
if(flow.state==='WAITING_APPROVAL'){const label=add(card,'label','Edited answer');const draft=add(card,'textarea');draft.value=flow.draft;draft.setAttribute('aria-label','Edited answer');const reason=add(card,'input');reason.placeholder='Reason for review decision';reason.setAttribute('aria-label','Review reason');for(const decision of ['approve','edit','reject']){const button=add(card,'button',decision);button.onclick=()=>action(async()=>api('review',{id:flow.id,decision,reason:reason.value,edited:draft.value,revision:flow.revision,binding:flow.review_binding}))}}
if(!['COMPLETE','FAILED','REJECTED'].includes(flow.state)){const button=add(card,'button','Resume workflow');button.onclick=()=>action(async()=>api('resume',{id:flow.id}))}
if(flow.published){add(card,'h3','Published answer');add(card,'p',flow.published.content)}}}
el('question-form').onsubmit=e=>{e.preventDefault();action(async()=>api('create',{question:el('question').value}))};el('refresh').onclick=()=>action(refresh);el('inventory').onclick=()=>action(async()=>{el('sources').textContent=JSON.stringify(await api('knowledge'),null,2)});el('update').onclick=()=>action(async()=>api('update',{document:JSON.parse(el('document').value)}));el('rollback').onclick=()=>action(async()=>api('rollback',{document_id:el('docid').value,version:Number(el('version').value),reason:el('rollback-reason').value}));refresh().catch(error=>el('message').textContent=error.message);
</script></body></html>
